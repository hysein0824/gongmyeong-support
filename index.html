*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}

table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--note)}
blockquote{margin:16px 0;padding:12px 16px;background:var(--note);border-left:4px solid var(--accent);border-radius:6px}
mark{background:var(--mark);color:var(--markInk);padding:0 2px;border-radius:3px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
ul,ol{padding-left:1.4em}
footer{color:var(--muted);font-size:14px;padding:16px 16px 40px}
